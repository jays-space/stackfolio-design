document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

4A;\">/<\u002Fspan><span style=\"color: #ECE7DC;\">Badge<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<div data-screen-label=\"StackFolio — Badge\" style=\"\n  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px; --space-9: 96px;\n  --text-code-sm: 12px; --lh-code-sm: 18px;\n  --text-caption: 12px; --lh-caption: 16px;\n  --text-body-sm: 14px; --lh-body-sm: 22px;\n  --text-code: 14px; --lh-code: 22px;\n  --text-body: 16px; --lh-body: 26px;\n  --text-read: 17px; --lh-read: 27px;\n  --text-h5: 20px; --lh-h5: 28px;\n  --text-h4: 25px; --lh-h4: 33px;\n  --text-h3: 31px; --lh-h3: 40px;\n  --text-h2: 39px; --lh-h2: 47px;\n  --text-h1: 49px; --lh-h1: 55px;\n  --surface-1: #242320; --surface-2: #1B1A18; --surface-3: #131211; --surface-sunk: #0E0D0C;\n  --boundary-1: #37342D; --boundary-2: #26241F; --boundary-3: #1B1A18;\n  --text-primary: #ECE7DC; --text-secondary: #9B948A; --text-dim: #918A7F; --text-label: #B9AFA0;\n  --accent: #A8342B; --accent-deep: #7E2620; --accent-quiet: rgba(168,52,43,0.12); --confirm: #D9705C;\n  --caution: #B87264; --caution-deep: #9C5B4E; --caution-quiet: rgba(184,114,100,0.14);\n  --control-h-sm: 28px; --control-h-md: 36px; --control-h-lg: 44px; --hit-min: 44px;\n  --focus-ring: #D9705C; --scrim: rgba(9,8,8,0.72);\n  --radius-1: 0px; --radius-2: 2px; --radius-3: 3px;\n  --op-disabled: 0.38; --op-muted: 0.62;\n  --grain-1: repeating-linear-gradient(180deg, rgba(0,0,0,0.09) 0 1px, transparent 1px 5px);\n  --grain-2: repeating-linear-gradient(180deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 4px);\n  --font-heading: 'Epilogue', system-ui, sans-serif;\n  --font-body: 'Manrope', system-ui, sans-serif;\n  --font-label: 'Space Grotesk', ui-monospace, monospace;\n  --font-mono: 'Geist Mono', ui-monospace, monospace;\n  --ease-settle: cubic-bezier(0.22, 0.68, 0.12, 1);\n  --dur-quick: 180ms; --dur-base: 320ms; --dur-slow: 560ms;\n  background: var(--surface-3); color: var(--text-primary); font-family: var(--font-body);\n  width: 100%; min-height: 100vh; padding-bottom: var(--space-9);\n\">\n\n\n  <header style=\"max-width: 1280px; margin: 0 auto; padding: var(--space-8) var(--space-6) var(--space-6); border-bottom: 2px solid var(--boundary-1); display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: var(--space-8); align-items: end;\">\n    <div style=\"display: flex; flex-direction: column; gap: var(--space-3);\">\n      <span style=\"font-family: var(--font-label); font-size: var(--text-caption); letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim);\">Component · Badge<\u002Fspan>\n      <h1 style=\"margin: 0; font-family: var(--font-heading); font-size: var(--text-h2); line-height: var(--lh-h2); font-weight: 700; letter-spacing: -0.022em;\">A word in a box, kept neutral so the domains can colour it<\u002Fh1>\n      <p style=\"margin: 0; max-width: 72ch; font-size: var(--text-read); line-height: var(--lh-read); color: var(--text-secondary); text-wrap: pretty;\">Badge is the label that track, provenance, conclusion and niche are all built from. It carries no meaning of its own: three emphases, two sizes, an optional leading mark. Everything a domain badge adds is colour and a word.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: var(--space-3); border-left: 2px solid var(--boundary-1); padding-left: var(--space-5);\">\n      <span style=\"font-family: var(--font-label); font-size: var(--text-caption); letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim);\">Contents<\u002Fspan>\n      <div style=\"display: grid; gap: var(--space-1); font-family: var(--font-label); font-size: var(--text-caption); color: var(--text-secondary);\">\n        <span style=\"display: flex; gap: var(--space-3);\"><span style=\"color: var(--text-dim);\">01<\u002Fspan><span>Emphasis<\u002Fspan><\u002Fspan>\n        <span style=\"display: flex; gap: var(--space-3);\"><span style=\"color: var(--text-dim);\">02<\u002Fspan><span>Sizes<\u002Fspan><\u002Fspan>\n        <span style=\"display: flex; gap: var(--space-3);\"><span style=\"color: var(--text-dim);\">03<\u002Fspan><span>The matrix<\u002Fspan><\u002Fspan>\n        <span style=\"display: flex; gap: var(--space-3);\"><span style=\"color: var(--text-dim);\">04<\u002Fspan><span>Leading mark<\u002Fspan><\u002Fspan>\n        <span style=\"display: flex; gap: var(--space-3);\"><span style=\"color: var(--text-dim);\">05<\u002Fspan><span>Removable<\u002Fspan><\u002Fspan>\n        <span style=\"display: flex; gap: var(--space-3);\"><span style=\"color: var(--text-dim);\">06<\u002Fspan><span>Theming &amp; in place<\u002Fspan><\u002Fspan>\n        <span style=\"display: flex; gap: var(--space-3);\"><span style=\"color: var(--text-dim);\">07<\u002Fspan><span>Rules &amp; accessibility<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"max-width: 1280px; margin: 0 auto; padding: var(--space-7) var(--space-6) 0; display: flex; flex-direction: column; gap: var(--space-8);\">\n\n    <section style=\"display: flex; flex-direction: column; gap: var(--space-5);\" data-screen-label=\"01 Emphasis\">\n      <div style=\"display: flex; align-items: baseline; gap: var(--space-4); flex-wrap: wrap; border-bottom: 1px solid var(--boundary-1); padding-bottom: var(--space-3);\">\n        <span style=\"font-family: var(--font-label); font-size: var(--text-caption); letter-spacing: 0.14em; color: var(--text-dim);\">01<\u002Fspan>\n        <h2 style=\"margin: 0; font-family: var(--font-heading); font-size: var(--text-h4); line-height: var(--lh-h4); font-weight: 700; letter-spacing: -0.018em;\">Emphasis<\u002Fh2>\n        <span style=\"font-size: var(--text-body-sm); line-height: var(--lh-body-sm); color: var(--text-secondary); max-width: 66ch; text-wrap: pretty;\">Three, and the choice is about how loud the label is against what it sits beside — not about what the label says. Subtle is the default; a page with more than one solid badge in view has picked wrong.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--space-5);\">\n        <sc-for list=\"{{ emphasisCards }}\" as=\"e\" hint-placeholder-count=\"3\">\n          <div style=\"background: var(--surface-2); background-image: var(--grain-2); border-top: 2px solid var(--boundary-1); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4);\">\n            <div style=\"display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap;\">\n              <dc-import name=\"Badge\" label=\"Tracked\" emphasis=\"{{ e.emphasis }}\" size=\"md\" hint-size=\"96px,26px\"><\u002Fdc-import>\n              <dc-import name=\"Badge\" label=\"Draft\" emphasis=\"{{ e.emphasis }}\" size=\"md\" marker=\"dot\" hint-size=\"96px,26px\"><\u002Fdc-import>\n            <\u002Fdiv>\n            <span style=\"display: flex; flex-direction: column; gap: var(--space-1);\">\n              <span style=\"font-family: var(--font-label); font-size: var(--text-caption); letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-label);\">{{ e.name }}<\u002Fspan>\n              <span style=\"font-family: var(--font-mono); font-size: var(--text-code-sm); color: var(--text-dim); overflow-wrap: anywhere;\">{{ e.tokens }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"font-size: var(--text-body-sm); line-height: var(--lh-body-sm); color: var(--text-secondary); text-wrap: pretty;\">{{ e.body }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display: flex; flex-direction: column; gap: var(--space-5);\" data-screen-label=\"02 Sizes\">\n      <div style=\"display: flex; align-items: baseline; gap: var(--space-4); flex-wrap: wrap; border-bottom: 1px solid var(--boundary-1); padding-bottom: var(--space-3);\">\n        <span style=\"font-family: var(--font-label); font-size: var(--text-caption); letter-spacing: 0.14em; color: var(--text-dim);\">02<\u002Fspan>\n        <h2 style=\"margin: 0; font-family: var(--font-heading); font-size: var(--text-h4); line-height: var(--lh-h4); font-weight: 700; letter-spacing: -0.018em;\">Sizes<\u002Fh2>\n        <span style=\"font-size: var(--text-body-sm); line-height: var(--lh-body-sm); color: var(--text-secondary); max-width: 66ch; text-wrap: pretty;\">Two. Both set the label at the caption role — the size changes the padding and the tracking, never the type size, so a badge beside a heading reads at the same weight as one in a row.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column;\">\n        <sc-for list=\"{{ sizeRows }}\" as=\"z\" hint-placeholder-count=\"2\">\n          <div style=\"display: grid; grid-template-columns: 120px 160px minmax(0,1fr) minmax(0,320px); gap: var(--space-5); align-items: center; border-bottom: 1px solid var(--boundary-3); padding: var(--space-5) 0;\">\n            <span style=\"font-family: var(--font-mono); font-size: var(--text-code-sm); line-height: var(--lh-code-sm); color: var(--text-primary);\">{{ z.name }}<\u002Fspan>\n            <span style=\"display: flex;\"><dc-import name=\"Badge\" label=\"Provenance\" size=\"{{ z.size }}\" emphasis=\"subtle\" hint-size=\"110px,24px\"><\u002Fdc-import><\u002Fspan>\n            <span style=\"font-family: var(--font-mono); font-size: var(--text-code-sm); line-height: var(--lh-code-sm); color: var(--text-dim); overflow-wrap: anywhere;\">{{ z.tokens }}<\u002Fspan>\n            <span style=\"font-size: var(--text-caption); line-height: var(--lh-caption); color: var(--text-secondary); text-wrap: pretty;\">{{ z.note }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display: flex; flex-direction: column; gap: var(--space-5);\" data-screen-label=\"03 The matrix\">\n      <div style=\"display: flex; align-items: baseline; gap: var(--space-4); flex-wrap: wrap; border-bottom: 1px solid var(--boundary-1); padding-bottom: var(--space-3);\">\n        <span style=\"font-family: var(--font-label); font-size: var(--text-caption); letter-spacing: 0.14em; color: var(--text-dim);\">03<\u002Fspan>\n        <h2 style=\"margin: 0; font-family: var(--font-heading); font-size: var(--text-h4); line-height: var(--lh-h4); font-weight: 700; letter-spacing: -0.018em;\">The matrix<\u002Fh2>\n        <span style=\"font-size: var(--text-body-sm); line-height: var(--lh-body-sm); color: var(--text-secondary); max-width: 66ch; text-wrap: pretty;\">Every emphasis at both sizes, with and without a leading mark. Six cells per column: the whole generic component.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 140px repeat(3, minmax(0,1fr)); gap: var(--space-5); align-items: center; border-bottom: 1px solid var(--boundary-1); padding-bottom: var(--space-3);\">\n        <span><\u002Fspan>\n        <sc-for list=\"{{ emphasisHeads }}\" as=\"h\" hint-placeholder-count=\"3\">\n          <span style=\"font-family: var(--font-label); font-size: var(--text-caption); letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-label);\">{{ h.label }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-for list=\"{{ matrixRows }}\" as=\"m\" hint-placeholder-count=\"6\">\n        <div style=\"display: grid; grid-template-columns: 140px repeat(3, minmax(0,1fr)); gap: var(--space-5); align-items: center; border-bottom: 1px solid var(--boundary-3); padding: var(--space-4) 0;\">\n          <span style=\"display: flex; flex-direction: column; gap: var(--space-1);\">\n            <span style=\"font-family: var(--font-mono); font-size: var(--text-code-sm); color: var(--text-primary);\">{{ m.size }}<\u002Fspan>\n            <span style=\"font-family: var(--font-mono); font-size: var(--text-code-sm); color: var(--text-dim);\">{{ m.markerLabel }}<\u002Fspan>\n          <\u002Fspan>\n          <span style=\"display: flex;\"><dc-import name=\"Badge\" label=\"Tracked\" emphasis=\"solid\" size=\"{{ m.size }}\" marker=\"{{ m.marker }}\" hint-size=\"96px,24px\"><\u002Fdc-import><\u002Fspan>\n          <span style=\"display: flex;\"><dc-import name=\"Badge\" label=\"Tracked\" emphasis=\"subtle\" size=\"{{ m.size }}\" marker=\"{{ m.marker }}\" hint-size=\"96px,24px\"><\u002Fdc-import><\u002Fspan>\n          <span style=\"display: flex;\"><dc-import name=\"Badge\" label=\"Tracked\" emphasis=\"outline\" size=\"{{ m.size }}\" marker=\"{{ m.marker }}\" hint-size=\"96px,24px\"><\u002Fdc-import><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n\n    <section style=\"display: flex; flex-direction: column; gap: var(--space-5);\" data-screen-label=\"04 Leading mark\">\n      <div style=\"display: flex; align-items: baseline; gap: var(--space-4); flex-wrap: wrap; border-bottom: 1px solid var(--boundary-1); padding-bottom: var(--space-3);\">\n        <span style=\"font-family: var(--font-label); font-size: var(--text-caption); letter-spacing: 0.14em; color: var(--text-dim);\">04<\u002Fspan>\n        <h2 style=\"margin: 0; font-family: var(--font-heading); font-size: var(--text-h4); line-height: var(--lh-h4); font-weight: 700; letter-spacing: -0.018em;\">Leading mark<\u002Fh2>\n        <span style=\"font-size: var(--text-body-sm); line-height: var(--lh-body-sm); color: var(--text-secondary); max-width: 66ch; text-wrap: pretty;\">None, a dot, or a mark. The dot is a square — the system has one shape — and it exists so a set of badges can be told apart at a glance when they are stacked in a filter row.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--space-5);\">\n        <sc-for list=\"{{ markerCards }}\" as=\"k\" hint-placeholder-count=\"3\">\n          <div style=\"background: var(--surface-2); background-image: var(--grain-2); border-top: 1px solid var(--boundary-1); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4);\">\n            <div style=\"display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap;\">\n              <dc-import name=\"Badge\" label=\"Merged\" emphasis=\"subtle\" size=\"md\" marker=\"{{ k.marker }}\" hint-size=\"96px,26px\"><\u002Fdc-import>\n              <dc-import name=\"Badge\" label=\"Merged\" emphasis=\"outline\" size=\"md\" marker=\"{{ k.marker }}\" hint-size=\"96px,26px\"><\u002Fdc-import>\n            <\u002Fdiv>\n            <span style=\"font-family: var(--font-label); font-size: var(--text-caption); letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-label);\">{{ k.name }}<\u002Fspan>\n            <span style=\"font-size: var(--text-body-sm); line-height: var(--lh-body-sm); color: var(--text-secondary); text-wrap: pretty;\">{{ k.body }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display: flex; flex-direction: column; gap: var(--space-5);\" data-screen-label=\"05 Removable\">\n      <div style=\"display: flex; align-items: baseline; gap: var(--space-4); flex-wrap: wrap; border-bottom: 1px solid var(--boundary-1); padding-bottom: var(--space-3);\">\n        <span style=\"font-family: var(--font-label); font-size: var(--text-caption); letter-spacing: 0.14em; color: var(--text-dim);\">05<\u002Fspan>\n        <h2 style=\"margin: 0; font-family: var(--font-heading); font-size: var(--text-h4); line-height: var(--lh-h4); font-weight: 700; letter-spacing: -0.018em;\">Removable<\u002Fh2>\n        <span style=\"font-size: var(--text-body-sm); line-height: var(--lh-body-sm); color: var(--text-secondary); max-width: 66ch; text-wrap: pretty;\">The one interactive form, and it exists for exactly one job: an applied filter the reader can drop. A badge that states a fact — a track, a verdict, a niche — is never removable.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: var(--space-5);\">\n        <div style=\"background: var(--surface-2); background-image: var(--grain-2); border-top: 1px solid var(--boundary-1); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4);\">\n          <span style=\"font-family: var(--font-label); font-size: var(--text-caption); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-label);\">Applied filters · live<\u002Fspan>\n          <div style=\"display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; min-height: 30px;\">\n            <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"3\">\n              <dc-import name=\"Badge\" label=\"{{ f.label }}\" emphasis=\"subtle\" size=\"md\" marker=\"dot\" removable=\"{{ true }}\" sc-camel-on-remove=\"{{ f.onRemove }}\" hint-size=\"120px,26px\"><\u002Fdc-import>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ noFilters }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font-family: var(--font-label); font-size: var(--text-caption); letter-spacing: 0.06em; color: var(--text-dim);\">No filters applied<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ resetFilters }}\" style=\"align-self: flex-start; background: transparent; border: 1px solid var(--boundary-1); padding: var(--space-2) var(--space-3); font-family: var(--font-label); font-size: var(--text-caption); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-label); cursor: pointer;\">Reset<\u002Fbutton>\n          <span style=\"font-size: var(--text-caption); line-height: var(--lh-caption); color: var(--text-secondary); text-wrap: pretty;\">The close control is 14px at sm and 16px at md, well under the hit minimum. It is allowed because it sits inside a filter row that is pointer-only and duplicated by a Reset action; on touch layouts the row is replaced by a list of Buttons.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background: var(--surface-2); background-image: var(--grain-2); border-top: 1px solid var(--boundary-1); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4);\">\n          <span style=\"font-family: var(--font-label); font-size: var(--text-caption); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-label);\">Both sizes, all three emphases<\u002Fspan>\n          <div style=\"display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center;\">\n            <dc-import name=\"Badge\" label=\"AWS\" emphasis=\"solid\" size=\"sm\" removable=\"{{ true }}\" hint-size=\"80px,22px\"><\u002Fdc-import>\n            <dc-import name=\"Badge\" label=\"AWS\" emphasis=\"subtle\" size=\"sm\" removable=\"{{ true }}\" hint-size=\"80px,22px\"><\u002Fdc-import>\n            <dc-import name=\"Badge\" label=\"AWS\" emphasis=\"outline\" size=\"sm\" removable=\"{{ true }}\" hint-size=\"80px,22px\"><\u002Fdc-import>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center;\">\n            <dc-import name=\"Badge\" label=\"Identity\" emphasis=\"solid\" size=\"md\" marker=\"dot\" removable=\"{{ true }}\" hint-size=\"110px,26px\"><\u002Fdc-import>\n            <dc-import name=\"Badge\" label=\"Identity\" emphasis=\"subtle\" size=\"md\" marker=\"dot\" removable=\"{{ true }}\" hint-size=\"110px,26px\"><\u002Fdc-import>\n            <dc-import name=\"Badge\" label=\"Identity\" emphasis=\"outline\" size=\"md\" marker=\"dot\" removable=\"{{ true }}\" hint-size=\"110px,26px\"><\u002Fdc-import>\n          <\u002Fdiv>\n          <span style=\"font-size: var(--text-caption); line-height: var(--lh-caption); color: var(--text-secondary); text-wrap: pretty;\">Removable trims the right padding so the control sits closer to the edge than the label does, and the whole badge stays one box — no separate chip, no divider.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display: flex; flex-direction: column; gap: var(--space-5);\" data-screen-label=\"06 Theming and in place\">\n      <div style=\"display: flex; align-items: baseline; gap: var(--space-4); flex-wrap: wrap; border-bottom: 1px solid var(--boundary-1); padding-bottom: var(--space-3);\">\n        <span style=\"font-family: var(--font-label); font-size: var(--text-caption); letter-spacing: 0.14em; color: var(--text-dim);\">06<\u002Fspan>\n        <h2 style=\"margin: 0; font-family: var(--font-heading); font-size: var(--text-h4); line-height: var(--lh-h4); font-weight: 700; letter-spacing: -0.018em;\">Theming &amp; in place<\u002Fh2>\n        <span style=\"font-size: var(--text-body-sm); line-height: var(--lh-body-sm); color: var(--text-secondary); max-width: 66ch; text-wrap: pretty;\">A domain badge is this component with a tone and a word. Neutral is what ships; accent and caution are the two system tones a domain may reach for, and ink / fill / edge take a role token directly when a domain needs one the tones do not cover.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--space-5);\">\n        <sc-for list=\"{{ toneCards }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <div style=\"background: var(--surface-2); background-image: var(--grain-2); border-top: 1px solid var(--boundary-1); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4);\">\n            <div style=\"display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap;\">\n              <dc-import name=\"Badge\" label=\"{{ t.label }}\" tone=\"{{ t.tone }}\" emphasis=\"solid\" size=\"md\" hint-size=\"96px,26px\"><\u002Fdc-import>\n              <dc-import name=\"Badge\" label=\"{{ t.label }}\" tone=\"{{ t.tone }}\" emphasis=\"subtle\" size=\"md\" marker=\"dot\" hint-size=\"96px,26px\"><\u002Fdc-import>\n              <dc-import name=\"Badge\" label=\"{{ t.label }}\" tone=\"{{ t.tone }}\" emphasis=\"outline\" size=\"md\" marker=\"icon\" hint-size=\"96px,26px\"><\u002Fdc-import>\n            <\u002Fdiv>\n            <span style=\"font-family: var(--font-mono); font-size: var(--text-code-sm); color: var(--text-dim); overflow-wrap: anywhere;\">{{ t.tokens }}<\u002Fspan>\n            <span style=\"font-size: var(--text-body-sm); line-height: var(--lh-body-sm); color: var(--text-secondary); text-wrap: pretty;\">{{ t.body }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: var(--space-5);\">\n        <div style=\"background: var(--surface-2); background-image: var(--grain-2); border-top: 1px solid var(--boundary-1); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4);\">\n          <span style=\"font-family: var(--font-label); font-size: var(--text-caption); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-label);\">Case row · sm<\u002Fspan>\n          <div style=\"display: flex; flex-direction: column; gap: var(--space-3); border: 1px solid var(--boundary-1); padding: var(--space-4);\">\n            <span style=\"font-family: var(--font-heading); font-size: var(--text-h5); line-height: var(--lh-h5); font-weight: 700; letter-spacing: -0.014em;\">Token refresh races the retry budget<\u002Fspan>\n            <div style=\"display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center;\">\n              <dc-import name=\"Badge\" label=\"Tracked\" emphasis=\"subtle\" size=\"sm\" marker=\"dot\" hint-size=\"86px,22px\"><\u002Fdc-import>\n              <dc-import name=\"Badge\" label=\"First-hand\" emphasis=\"outline\" size=\"sm\" hint-size=\"90px,22px\"><\u002Fdc-import>\n              <dc-import name=\"Badge\" label=\"Identity\" emphasis=\"outline\" size=\"sm\" hint-size=\"80px,22px\"><\u002Fdc-import>\n              <span style=\"font-family: var(--font-label); font-size: var(--text-caption); color: var(--text-dim);\">two days ago<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"font-size: var(--text-caption); line-height: var(--lh-caption); color: var(--text-secondary); text-wrap: pretty;\">Small in a row of them, and only one badge in the set carries a mark — the one whose value changes over time.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background: var(--surface-2); background-image: var(--grain-2); border-top: 1px solid var(--boundary-1); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4);\">\n          <span style=\"font-family: var(--font-label); font-size: var(--text-caption); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-label);\">Case head · md<\u002Fspan>\n          <div style=\"display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap;\">\n            <h3 style=\"margin: 0; font-family: var(--font-heading); font-size: var(--text-h4); line-height: var(--lh-h4); font-weight: 700; letter-spacing: -0.018em;\">Adapter rewrite<\u002Fh3>\n            <dc-import name=\"Badge\" label=\"Accepted\" tone=\"accent\" emphasis=\"solid\" size=\"md\" hint-size=\"100px,26px\"><\u002Fdc-import>\n          <\u002Fdiv>\n          <span style=\"font-size: var(--text-caption); line-height: var(--lh-caption); color: var(--text-secondary); text-wrap: pretty;\">Medium beside a heading, solid, one of them. The badge is the verdict; nothing else on the line competes with it.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display: flex; flex-direction: column; gap: var(--space-5);\" data-screen-label=\"07 Rules and accessibility\">\n      <div style=\"display: flex; align-items: baseline; gap: var(--space-4); flex-wrap: wrap; border-bottom: 1px solid var(--boundary-1); padding-bottom: var(--space-3);\">\n        <span style=\"font-family: var(--font-label); font-size: var(--text-caption); letter-spacing: 0.14em; color: var(--text-dim);\">07<\u002Fspan>\n        <h2 style=\"margin: 0; font-family: var(--font-heading); font-size: var(--text-h4); line-height: var(--lh-h4); font-weight: 700; letter-spacing: -0.018em;\">Rules &amp; accessibility<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: var(--space-5) var(--space-7);\">\n        <sc-for list=\"{{ rules }}\" as=\"r\" hint-placeholder-count=\"6\">\n          <div style=\"display: flex; flex-direction: column; gap: var(--space-2); border-top: 1px solid var(--boundary-2); padding-top: var(--space-3);\">\n            <span style=\"font-family: var(--font-label); font-size: var(--text-caption); letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-label);\">{{ r.name }}<\u002Fspan>\n            <span style=\"font-size: var(--text-body-sm); line-height: var(--lh-body-sm); color: var(--text-secondary); text-wrap: pretty;\">{{ r.body }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1360}}\">\nconst ALL_FILTERS = ['AWS/Backend', 'Identity', 'First-hand', 'Tracked'];\n\nclass Component extends DCLogic {\n  state = { filters: ALL_FILTERS.slice(0, 3) };\n\n  renderVals() {\n    return {\n      emphasisCards: [\n        ['Solid', 'solid', 'fill surface-1 · ink text-primary · edge boundary-1', 'The filled box. Reserved for the one badge on a screen that is the answer to the question the screen asks — a verdict at the head of a case, a state at the head of a row.'],\n        ['Subtle', 'subtle', 'fill surface-2 + grain-1 · ink text-label · no edge', 'The default. A quiet fill and no border, so a run of them beside a title reads as one band of metadata rather than four objects.'],\n        ['Outline', 'outline', 'fill transparent · ink text-label · edge boundary-1', 'For badges over a surface that is already filled — inside a card, over a panel — where a second fill would stack two greys with nothing between them.']\n      ].map(e => ({ name: e[0], emphasis: e[1], tokens: e[2], body: e[3] })),\n\n      sizeRows: [\n        ['sm', 'sm', 'pad 1/6px · gap 5px · caption 12px · track 0.10em', 'Case rows, filter rows, anywhere a badge sits in a line with body text. The default size — most badges in the product are this one.'],\n        ['md', 'md', 'pad 3/9px · gap 7px · caption 12px · track 0.12em', 'Beside an h4 or larger, or alone at the head of a panel. Use it when the badge has to hold its own against a heading.']\n      ].map(z => ({ name: z[0], size: z[1], tokens: z[2], note: z[3] })),\n\n      emphasisHeads: [{ label: 'Solid' }, { label: 'Subtle' }, { label: 'Outline' }],\n\n      matrixRows: [\n        { size: 'sm', marker: 'none', markerLabel: 'no mark' },\n        { size: 'sm', marker: 'dot', markerLabel: 'dot' },\n        { size: 'sm', marker: 'icon', markerLabel: 'icon' },\n        { size: 'md', marker: 'none', markerLabel: 'no mark' },\n        { size: 'md', marker: 'dot', markerLabel: 'dot' },\n        { size: 'md', marker: 'icon', markerLabel: 'icon' }\n      ],\n\n      markerCards: [\n        ['None', 'none', 'The word carries it. If a set of badges is already distinguished by what it says, a mark adds a second thing to scan for nothing.'],\n        ['Dot', 'dot', 'A 5px square at sm, 6px at md, in the tone colour — text-dim on neutral. It marks the badge whose value can change, so a reader learns which one to check.'],\n        ['Icon', 'icon', 'A drawn mark at the same size as the dot, for domains that have their own glyph. It is never a second word and never larger than the cap height of the label.']\n      ].map(k => ({ name: k[0], marker: k[1], body: k[2] })),\n\n      toneCards: [\n        ['Neutral', 'neutral', 'Tracked', 'surface-1 / surface-2 / boundary-1 · text-label', 'What the generic Badge ships as. Every domain badge starts here and overrides only what its meaning requires.'],\n        ['Accent', 'accent', 'Accepted', 'accent / accent-quiet · confirm', 'The system accent. One meaning only — the case is resolved — so it is never used for emphasis on a badge that states something else.'],\n        ['Caution', 'caution', 'Contested', 'caution-deep / caution-quiet · caution', 'Held, contested, or expired. It signals that the label is provisional, not that anything is wrong.']\n      ].map(t => ({ name: t[0], tone: t[1], label: t[2], tokens: t[3], body: t[4] })),\n\n      filters: this.state.filters.map(f => ({\n        label: f,\n        onRemove: () => this.setState(s => ({ filters: s.filters.filter(x => x !== f) }))\n      })),\n      noFilters: this.state.filters.length === 0,\n      resetFilters: () => this.setState({ filters: ALL_FILTERS.slice(0, 3) }),\n\n      rules: [\n        ['One shape', 'Square, radius-1, one border width. There is no pill in this system — the rounded tag is the shape every other product uses, and the box is what makes a StackFolio badge legible as one.'],\n        ['Neutral by default', 'The generic Badge has no colour of its own. A tone is a claim about meaning, and only a domain badge is entitled to make one.'],\n        ['The label is a label', 'Caption role, uppercase, one or two words. A badge that needs a sentence is a line of text; a badge that needs a number is a count beside a link.'],\n        ['Not a link', 'A static badge has no hover, focus or press. Where a badge navigates, it is wrapped in a Link that owns the target and the ring; where it filters, it is removable and the close control is the only interactive part.'],\n        ['Announced as text', 'The label is read as ordinary text — no role, no aria-label duplicating the word. The close control is a real button labelled \"Remove {label}\", and removal moves focus to the next badge or the row.'],\n        ['One solid per view', 'Solid is the loudest thing on a line. Two of them in the same view means neither is the answer, and the reader has to choose which to believe.']\n      ].map(r => ({ name: r[0], body: r[1] }))\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
